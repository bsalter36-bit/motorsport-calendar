<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motorsport Calendar</title>
<meta name="description" content="F1, F2, F3 and rally championship dates in one calendar.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calendar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --elev: #FFFFFF;
  --label: #000000;
  --label-2: rgba(60, 60, 67, .6);
  --label-3: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .2);
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .07);
  --tint: #007AFF;
  --today: #FF3B30;
  --live: #34C759;
  --bar-bg: rgba(249, 249, 249, .8);
  --seg-active: #FFFFFF;
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 54px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1C1C1E;
    --elev: #2C2C2E;
    --label: #FFFFFF;
    --label-2: rgba(235, 235, 245, .6);
    --label-3: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .6);
    --fill: rgba(118, 118, 128, .24);
    --fill-2: rgba(118, 118, 128, .12);
    --tint: #0A84FF;
    --today: #FF453A;
    --live: #30D158;
    --bar-bg: rgba(22, 22, 24, .8);
    --seg-active: #636366;
    --shadow: none;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(110px + env(safe-area-inset-top, 0px)); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--label);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 8px;
}
a { color: var(--tint); }
svg { display: block; }
[hidden] { display: none !important; }
.tabular { font-variant-numeric: tabular-nums; }

/* ---------- Navigation bar ---------- */
.navbar {
  position: sticky; top: 0; z-index: 40;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent;
  transition: border-color .2s;
}
.navbar.scrolled { border-bottom-color: var(--sep); }
.navbar-inner {
  max-width: 1200px; margin: 0 auto;
  height: 50px; padding: 0 10px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
}
.nav-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand { display: none; font: 700 17px var(--font-display); white-space: nowrap; }
.nav-title { font-weight: 600; font-size: 17px; white-space: nowrap; opacity: 0; transition: opacity .2s; }
.navbar.scrolled .nav-title { opacity: 1; }
.nav-right { display: flex; justify-content: flex-end; gap: 2px; }
.nav-btn {
  width: 40px; height: 40px; border-radius: 20px;
  display: grid; place-items: center; color: var(--tint);
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:active { opacity: .35; }

.year-wrap { position: relative; display: inline-flex; align-items: center; color: var(--tint); }
.year-wrap select {
  appearance: none; -webkit-appearance: none;
  border: 0; background: var(--fill); color: var(--tint);
  font: 600 15px var(--font); font-variant-numeric: tabular-nums;
  height: 32px; padding: 0 28px 0 12px; border-radius: 16px; cursor: pointer;
}
.year-wrap svg { position: absolute; right: 10px; width: 10px; height: 10px; pointer-events: none; }

.segmented {
  display: none; grid-auto-flow: column; grid-auto-columns: 1fr;
  background: var(--fill); border-radius: 9px; padding: 2px; min-width: 380px;
}
.segmented button {
  font-size: 13px; font-weight: 500; padding: 5px 14px; border-radius: 7px;
  transition: background .15s;
}
.segmented button.active {
  background: var(--seg-active); font-weight: 600;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 3px 1px rgba(0, 0, 0, .04);
}

/* ---------- Page ---------- */
main {
  max-width: 1200px; margin: 0 auto;
  padding: 0 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
}
.page-head { padding: 4px 4px 10px; }
.large-title { margin: 0; font: 700 34px/41px var(--font-display); letter-spacing: .01em; }
.page-sub { margin: 2px 0 0; font-size: 15px; color: var(--label-2); }

.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.toolbar-row { display: flex; flex-direction: column; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 8px; border-radius: 10px;
  background: var(--fill); color: var(--label-2);
}
.search svg { width: 16px; height: 16px; flex: none; }
.search input {
  flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
  font: 17px var(--font); color: var(--label);
}
.search input::placeholder { color: var(--label-2); }
.search .clear { width: 22px; height: 22px; display: grid; place-items: center; color: var(--label-3); }

.scroller {
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px; padding: 2px 16px;
  scroll-snap-type: x proximity;
}
.scroller::-webkit-scrollbar { display: none; }

.chip {
  flex: none; height: 32px; padding: 0 12px 0 10px; border-radius: 16px;
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--card); color: var(--label-2);
  font-size: 14px; font-weight: 500; white-space: nowrap;
  box-shadow: inset 0 0 0 .5px var(--sep);
  scroll-snap-align: start;
  transition: background .15s, color .15s;
}
.chip .dot { width: 10px; height: 10px; border-radius: 5px; box-shadow: inset 0 0 0 1.5px var(--c); }
.chip.on { color: var(--label); background: color-mix(in srgb, var(--c) 16%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent); }
.chip.on .dot { background: var(--c); }
.chip.all.on { background: var(--label); color: var(--bg); box-shadow: none; }
.chip:active { transform: scale(.96); }

.month-pill {
  flex: none; position: relative; height: 30px; padding: 0 13px; border-radius: 15px;
  background: var(--fill-2); font-size: 14px; font-weight: 600; color: var(--label);
  scroll-snap-align: start;
}
.month-pill.empty { color: var(--label-3); }
.month-pill.active { background: var(--label); color: var(--bg); }
.month-pill.current::after {
  content: ""; position: absolute; top: 4px; right: 5px;
  width: 6px; height: 6px; border-radius: 3px; background: var(--today);
}

/* ---------- Up next (the one bold element) ---------- */
.upnext {
  position: relative; overflow: hidden; cursor: pointer;
  border-radius: 22px; padding: 18px 20px 18px;
  background: var(--c); color: var(--on);
  display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: end;
  margin-bottom: 18px;
  transition: transform .15s;
}
.upnext:active { transform: scale(.985); }
.upnext.unc { background: color-mix(in srgb, var(--c) 30%, var(--card)); color: var(--label); outline: 2px dashed var(--c); outline-offset: -2px; }
.upnext.prov { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 8px, transparent 8px 16px); }
.upnext .kicker { grid-column: 1 / -1; font-size: 15px; font-weight: 600; opacity: .8; }
.upnext .title { font: 700 26px/1.15 var(--font-display); margin: 2px 0 4px; letter-spacing: .005em; }
.upnext .when { font-size: 15px; font-weight: 500; opacity: .85; }
.upnext .count { text-align: right; line-height: 1; }
.upnext .num { font: 800 56px/0.9 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.upnext .unit { font-size: 15px; font-weight: 600; opacity: .8; margin-top: 4px; }
.upnext .also { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.upnext .also span {
  font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px;
  background: rgba(255,255,255,.88); color: #000;
}
.upnext .also span i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: var(--c2); margin-right: 5px; vertical-align: 0; }

/* ---------- Grouped lists ---------- */
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.section { margin-bottom: 22px; break-inside: avoid; }
.section-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 0 4px 8px;
}
.section-head h2 { margin: 0; font: 700 22px var(--font-display); }
.section-head h2.cur { color: var(--today); }
.section-head .n { font-size: 15px; color: var(--label-2); }

.row {
  position: relative; display: grid; grid-template-columns: 4px 1fr auto;
  gap: 12px; align-items: center;
  padding: 10px 16px 10px 12px; min-height: 60px; cursor: pointer;
}
.row + .row::before {
  content: ""; position: absolute; top: 0; left: 28px; right: 0;
  height: .5px; background: var(--sep);
}
.row:active, .row:hover { background: var(--fill-2); }
.row .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); }
.row.unc .bar { background: repeating-linear-gradient(180deg, var(--c) 0 2px, transparent 2px 5px); opacity: .7; }
.badge.unc { box-shadow: none; border: 1px dashed var(--label-3); }
.row.prov .bar { background: repeating-linear-gradient(180deg, var(--c) 0 5px, transparent 5px 8px); }
.row .main { min-width: 0; }
.row .t { font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 13px; color: var(--label-2); white-space: nowrap; overflow: hidden; }
.row .end { text-align: right; white-space: nowrap; }
.row .d { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.row .rel { font-size: 12px; color: var(--label-2); margin-top: 2px; }
.row.live .rel { color: var(--live); font-weight: 600; }
.row.past { opacity: .45; }
.badge {
  display: inline-block; font-size: 11px; font-weight: 600; line-height: 1;
  padding: 3px 6px; border-radius: 5px; color: var(--label-2);
  box-shadow: inset 0 0 0 1px var(--label-3);
}

.empty {
  text-align: center; padding: 48px 20px; color: var(--label-2);
}
.empty h3 { margin: 0 0 6px; color: var(--label); font: 600 20px var(--font-display); }
.empty button { margin-top: 14px; color: var(--tint); font-weight: 600; }

/* ---------- Month view ---------- */
.month-card { background: var(--card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 22px; touch-action: pan-y; }
.month-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 10px 18px; }
.month-head h2 { margin: 0; font: 700 24px var(--font-display); }
.month-head h2 span { color: var(--today); }
.ctrls { display: flex; gap: 8px; align-items: center; }
.circle-btn { width: 34px; height: 34px; border-radius: 17px; background: var(--fill); color: var(--tint); display: grid; place-items: center; }
.circle-btn svg { width: 14px; height: 14px; }
.pill-btn { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 600; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 0 6px; text-align: center; font-size: 12px; font-weight: 600; color: var(--label-2); }
.week { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); border-top: .5px solid var(--sep); }
.day { padding: 6px 4px 0; min-height: 96px; border-left: .5px solid var(--sep); }
.day:first-child { border-left: 0; }
.day.we { background: var(--fill-2); }
.day .n { width: 28px; height: 28px; margin: 0 auto; display: grid; place-items: center; border-radius: 14px; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.day.out .n { color: var(--label-3); }
.day.today .n { background: var(--today); color: #fff; font-weight: 700; }
.ebar {
  position: absolute; z-index: 2; height: 22px; line-height: 22px;
  padding: 0 6px; border-radius: 6px;
  background: var(--c); color: var(--on);
  font-size: 12px; font-weight: 600; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.ebar.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.ebar.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.ebar.unc { background: color-mix(in srgb, var(--c) 30%, var(--card)); color: var(--label); outline: 1.5px dashed var(--c); outline-offset: -1.5px; }
.ebar.prov { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 5px, transparent 5px 10px); }
.ebar:hover { filter: brightness(1.08); }

/* ---------- Year view: wide lane grid ---------- */
.yg-wrap { background: var(--card); border-radius: 20px; overflow: auto; box-shadow: var(--shadow); max-height: calc(100dvh - 190px); }
.yg { display: grid; grid-template-columns: 56px repeat(31, minmax(30px, 1fr)); min-width: 1060px; }
.yg .h { position: sticky; top: 0; z-index: 4; background: var(--card); text-align: center; padding: 9px 0 7px; font-size: 11px; font-weight: 600; color: var(--label-2); border-bottom: .5px solid var(--sep); font-variant-numeric: tabular-nums; }
.yg .h.corner { left: 0; z-index: 5; }
.yg .m { position: sticky; left: 0; z-index: 3; background: var(--card); display: flex; align-items: flex-start; justify-content: center; padding-top: 5px; font-size: 13px; font-weight: 700; border-right: .5px solid var(--sep); border-bottom: .5px solid var(--sep); cursor: pointer; }
.yg .m.cur { color: var(--today); }
.yg .dw { text-align: center; font-size: 10px; font-weight: 600; color: var(--label-3); padding: 4px 0 2px; }
.yg .dw.we { color: var(--label-2); }
.yg .lc { position: relative; height: 26px; }
.yg .we { background: var(--fill-2); }
.yg .na { background: repeating-linear-gradient(135deg, var(--fill-2) 0 3px, transparent 3px 7px); }
.yg .last { border-bottom: .5px solid var(--sep); }
.yg .td { box-shadow: inset 1.5px 0 0 var(--today), inset -1.5px 0 0 var(--today); }
.ybar {
  position: absolute; left: 1px; top: 3px; height: 20px; line-height: 20px; z-index: 2;
  padding: 0 5px; border-radius: 5px; background: var(--c); color: var(--on);
  font-size: 10.5px; font-weight: 600; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
}
.ybar.one { padding: 0 1px; letter-spacing: -.02em; }
.ybar.unc { background: color-mix(in srgb, var(--c) 30%, var(--card)); color: var(--label); outline: 1.5px dashed var(--c); outline-offset: -1.5px; }
.ybar.prov { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 4px, transparent 4px 8px); }
.ybar:hover { filter: brightness(1.08); z-index: 3; }

/* ---------- Year view: compact mini months ---------- */
.minis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.mini { background: var(--card); border-radius: 16px; padding: 12px 8px 10px; cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: flex-start; }
.mini:active { transform: scale(.98); }
.mini-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; }
.mini-head b { font: 700 17px var(--font-display); }
.mini.cur .mini-head b { color: var(--today); }
.mini-head span { font-size: 12px; color: var(--label-2); }
.mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 1px; }
.md { height: 22px; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.md span { width: 17px; height: 15px; display: grid; place-items: center; border-radius: 8px; }
.md.today span { background: var(--today); color: #fff; font-weight: 700; }
.md .dots { display: flex; gap: 1px; height: 4px; margin-top: 1px; }
.md .dots i { width: 4px; height: 4px; border-radius: 2px; background: var(--c); }

/* ---------- Series / settings ---------- */
.set-head { padding: 0 16px 7px; font-size: 13px; color: var(--label-2); }
.set-foot { padding: 7px 16px 0; font-size: 13px; color: var(--label-2); line-height: 1.4; }
.set-group { margin-bottom: 26px; }
.srow { position: relative; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; width: 100%; text-align: left; }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 60px; right: 0; height: .5px; background: var(--sep); }
.srow.plain + .srow::before, .srow + .srow.plain::before { left: 16px; }
.icon { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--c); color: var(--on); display: grid; place-items: center; font-size: 9.5px; font-weight: 800; letter-spacing: -.01em; }
.srow .txt { flex: 1; min-width: 0; padding: 8px 0; }
.srow .txt b { display: block; font-weight: 400; font-size: 17px; line-height: 1.25; }
.srow .txt small { display: block; font-size: 13px; color: var(--label-2); }
.srow .val { color: var(--label-2); font-size: 17px; }
.srow.action { color: var(--tint); }
.srow.action:active { background: var(--fill-2); }

.switch { position: relative; flex: none; width: 51px; height: 31px; }
.switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.switch .track { position: absolute; inset: 0; border-radius: 16px; background: var(--fill); transition: background .2s; }
.switch .thumb { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 14px; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 3px 1px rgba(0,0,0,.06); transition: transform .22s cubic-bezier(.3,.7,.4,1); }
.switch input:checked ~ .track { background: var(--live); }
.switch input:checked ~ .thumb { transform: translateX(20px); }
.switch input:focus-visible ~ .track { outline: 2px solid var(--tint); outline-offset: 2px; }

/* ---------- Bottom tab bar (phones) ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--bar-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-top: .5px solid var(--sep);
}
.tab { height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10px; font-weight: 500; color: var(--label-2); }
.tab svg { width: 25px; height: 25px; }
.tab.active { color: var(--tint); }

/* ---------- Sheet (event details) ---------- */
.backdrop {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s;
}
.backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 14px 14px 0 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  transform: translateY(100%); transition: transform .34s cubic-bezier(.2,.85,.25,1);
}
.backdrop.open .sheet { transform: translateY(0); }
.sheet.dragging { transition: none; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--label-3); margin: 6px auto 0; }
.sheet-top { display: flex; justify-content: flex-end; padding: 4px 12px 0; }
.done { color: var(--tint); font-size: 17px; font-weight: 600; padding: 8px 6px; }
.hero {
  margin: 0 16px 18px; padding: 18px 18px 20px; border-radius: 18px;
  background: var(--c); color: var(--on);
}
.hero.unc { background: color-mix(in srgb, var(--c) 30%, var(--card)); color: var(--label); outline: 2px dashed var(--c); outline-offset: -2px; }
.hero.prov { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 8px, transparent 8px 16px); }
.hero .series { font-size: 15px; font-weight: 600; opacity: .85; }
.hero h2 { margin: 6px 0 6px; font: 700 26px/1.15 var(--font-display); }
.hero .dates { font-size: 15px; font-weight: 500; opacity: .9; }
.sheet .group { margin: 0 16px 16px; }
.kv { position: relative; display: flex; justify-content: space-between; gap: 16px; padding: 13px 16px; font-size: 17px; }
.kv + .kv::before, .kv + .act::before, .act + .act::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }

.note { padding: 0 32px 16px; font-size: 13px; color: var(--label-2); line-height: 1.45; }

const CAT_LOOKUP = {};

  if ((m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`; // UK day/month/year

    const mi = MON.findIndex(x => m[2].toLowerCase().startsWith(x.toLowerCase()));

async function loadData(opts = {}) {

    const res = await fetch(CONFIG.DATA_URL, { cache: 'no-store', signal: ctrl.signal });

function upcomingToggle() {

// ---------- Up next ----------
function upNext() {
  const t = todayISO();

  const c = CHAMPIONSHIPS[next.catCode];
  let num, unit, kicker;
  const d = dayDiff(t, next.startDate);
  if (next.startDate <= t) { kicker = 'On now'; num = `Day ${dayDiff(next.startDate, t) + 1}`; unit = `of ${days(next)}`; }
  else { kicker = 'Up next'; if (d < 14) { num = d; unit = d === 1 ? 'day' : 'days'; } else { num = Math.round(d / 7); unit = 'weeks'; } }
  const same = pool.filter(e => e !== next && overlaps(e, addDays(next.startDate, -1), addDays(next.endDate, 1))).slice(0, 4);
  return h('div', {
    class: 'upnext' + stc(next), role: 'button', tabindex: '0',
    style: { '--c': c.colour, '--on': c.on },
    onclick: () => openEvent(next), onkeydown: ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openEvent(next); } },
    'aria-label': `${kicker}: ${next.label}, ${fmtRange(next.startDate, next.endDate)}`,

    h('div', { class: 'count' }, h('div', { class: 'num' }, num), h('div', { class: 'unit' }, unit)),
    same.length ? h('div', { class: 'also' }, same.map(e => h('span', { style: { '--c2': CHAMPIONSHIPS[e.catCode].colour } }, h('i'), e.label))) : null

}

// ---------- Events (list) view ----------
function viewList(root) {
  const t = todayISO();
  const thisYear = new Date().getFullYear();
  if (P.year >= thisYear) { const u = upNext(); if (u) root.append(u); }
  let list = filtered({ search: true }).filter(e => inYear(e, P.year));
  if (P.year === thisYear && P.listMode === 'upcoming') list = list.filter(e => e.endDate >= t);
  if (!list.length) {
    const reason = P.search ? `Nothing matches “${P.search}”.` : P.hidden.length === CAT_ORDER.length ? 'Every championship is hidden.' : `No ${P.listMode === 'upcoming' && P.year === thisYear ? 'upcoming ' : ''}events in ${P.year} for the series you’ve chosen.`;
    root.append(h('div', { class: 'empty' }, h('h3', {}, 'No events to show'), h('div', {}, reason),
      P.search ? h('button', { onclick: () => { P.search = ''; render(); } }, 'Clear search')
        : P.hidden.length ? h('button', { onclick: () => { P.hidden = []; render(); } }, 'Show all series') : null));
    return;
  }
  const byMonth = new Map();
  for (const e of list) {
    const m = e.startDate.slice(0, 4) < String(P.year) ? 0 : +e.startDate.slice(5, 7) - 1;
    if (!byMonth.has(m)) byMonth.set(m, []);
    byMonth.get(m).push(e);
  }
  const now = new Date();
  const wrap = h('div', { class: 'list' + (wideMQ.matches ? ' cols' : '') });
  for (const [m, evs] of [...byMonth.entries()].sort((a, b) => a[0] - b[0])) {

    wrap.append(h('section', { class: 'section', id: `m-${P.year}-${pad(m + 1)}` },

// ---------- Lane packing ----------
function lanes(items) {
  const order = items.map((x, i) => ({ ...x, i })).sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
  const lanesEnd = []; const out = new Array(items.length);
  for (const it of order) {
    let l = lanesEnd.findIndex(end => end < it.s);
    if (l === -1) { l = lanesEnd.length; lanesEnd.push(it.e); } else lanesEnd[l] = it.e;
    out[it.i] = l;
  }
  return { lane: out, count: lanesEnd.length };
}

// ---------- Month view ----------
function viewMonthCal(root) {
  const y = P.year, m = viewMonth();
  const wide = wideMQ.matches;
  const go = delta => {
    const d = new Date(y, m + delta, 1);

    P.year = d.getFullYear(); P.month = d.getMonth(); render();
  };

    h('div', { class: 'month-head' },
      h('h2', {}, MONTHS[m], ' ', h('span', {}, y)),
      h('div', { class: 'ctrls' },
        h('button', { class: 'circle-btn', 'aria-label': 'Previous month', onclick: () => go(-1), html: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 4 7l5 5"/></svg>' }),
        h('button', { class: 'pill-btn', onclick: () => { const n = new Date(); if (!years().includes(n.getFullYear())) return; P.year = n.getFullYear(); P.month = n.getMonth(); render(); } }, 'Today'),
        h('button', { class: 'circle-btn', 'aria-label': 'Next month', onclick: () => go(1), html: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 2 5 5-5 5"/></svg>' }))),
    h('div', { class: 'dow' }, DOW.map(d => h('div', {}, wide ? d : d[0])))
  );
  const first = new Date(y, m, 1);
  const start = new Date(y, m, 1 - mondayIndex(first));
  const weeks = Math.ceil((mondayIndex(first) + dim(y, m)) / 7);
  const t = todayISO();
  const BAR = wide ? 22 : 18, GAP = 3, TOP = wide ? 38 : 31;
  const cellPx = (Math.min(window.innerWidth - (wide ? 56 : 32), 1144)) / 7;
  const evs = filtered();
  for (let w = 0; w < weeks; w++) {
    const ws = new Date(start); ws.setDate(start.getDate() + w * 7);
    const wsI = iso(ws), weI = addDays(wsI, 6);
    const week = h('div', { class: 'week' });
    for (let d = 0; d < 7; d++) {
      const di = addDays(wsI, d), dd = parse(di);
      week.append(h('div', { class: 'day' + (d >= 5 ? ' we' : '') + (dd.getMonth() !== m ? ' out' : '') + (di === t ? ' today' : '') },
        h('div', { class: 'n' }, dd.getDate())));
    }
    const items = evs.filter(e => overlaps(e, wsI, weI)).map(e => ({
      e, s: e.startDate < wsI ? 0 : dayDiff(wsI, e.startDate), e2: e.endDate > weI ? 6 : dayDiff(wsI, e.endDate),
    })).map(x => ({ ...x, e: x.e, s: x.s, end: x.e2 }));
    const packed = lanes(items.map(x => ({ s: x.s, e: x.end })));
    week.style.minHeight = Math.max(wide ? 96 : 64, TOP + packed.count * (BAR + GAP) + 6) + 'px';
    items.forEach((x, i) => {
      const c = CHAMPIONSHIPS[x.e.catCode];
      week.append(h('div', {
        class: 'ebar' + (x.e.startDate < wsI ? ' cl' : '') + (x.e.endDate > weI ? ' cr' : '') + stc(x.e),
        style: { '--c': c.colour, '--on': c.on, left: `calc(${x.s} / 7 * 100% + 2px)`, width: `calc(${x.end - x.s + 1} / 7 * 100% - 4px)`, top: `${TOP + packed.lane[i] * (BAR + GAP)}px` },
        title: `${x.e.label}, ${fmtRange(x.e.startDate, x.e.endDate)}`, role: 'button', tabindex: '0',
        onclick: () => openEvent(x.e), onkeydown: ev => { if (ev.key === 'Enter') openEvent(x.e); },
      }, fitText(x.e, (x.end - x.s + 1) * cellPx - 12, wide ? 6.6 : 5.6)));
    });
    card.append(week);
  }

  let sx = 0, sy = 0;
  card.addEventListener('touchstart', ev => { sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; }, { passive: true });

    const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy;

  }, { passive: true });
  root.append(card);

  const monthEvs = evs.filter(e => overlaps(e, `${y}-${pad(m + 1)}-01`, `${y}-${pad(m + 1)}-${pad(dim(y, m))}`));
  root.append(h('section', { class: 'section month-agenda' },
    h('div', { class: 'section-head' }, h('h2', {}, `This month`), h('span', { class: 'n' }, monthEvs.length)),
    monthEvs.length ? h('div', { class: 'group' }, monthEvs.map(eventRow)) : h('div', { class: 'group empty' }, `No events in ${MONTHS[m]} for the series you’ve chosen.`)));
}

// ---------- Year view ----------
function viewYear(root) {
  if (wideMQ.matches) yearGrid(root); else yearMinis(root);
}
function monthRange(y, m) { return [`${y}-${pad(m + 1)}-01`, `${y}-${pad(m + 1)}-${pad(dim(y, m))}`]; }
function openMonth(m) { P.view = 'month'; P.month = m; render(); window.scrollTo(0, 0); }

function yearGrid(root) {

  const g = h('div', { class: 'yg' });

  g.append(h('div', { class: 'h corner' }));
  for (let d = 1; d <= 31; d++) g.append(h('div', { class: 'h' }, d));
  const evs = filtered();
  for (let m = 0; m < 12; m++) {
    const n = dim(y, m), [a, b] = monthRange(y, m);
    const items = evs.filter(e => overlaps(e, a, b)).map(e => ({ e, s: e.startDate < a ? 1 : +e.startDate.slice(8), end: e.endDate > b ? n : +e.endDate.slice(8) }));
    const packed = lanes(items.map(x => ({ s: x.s, e: x.end })));
    const L = Math.max(packed.count, 1);
    g.append(h('div', { class: 'm' + (y === now.getFullYear() && m === now.getMonth() ? ' cur' : ''), style: { gridRow: `span ${L + 1}` }, role: 'button', tabindex: '0', title: `Open ${MONTHS[m]}`, onclick: () => openMonth(m) }, MON[m]));
    for (let d = 1; d <= 31; d++) {

      const wd = mondayIndex(new Date(y, m, d));
      g.append(h('div', { class: 'dw' + (wd >= 5 ? ' we' : '') }, 'MTWTFSS'[wd]));
    }
    for (let l = 0; l < L; l++) {
      const cells = [];
      for (let d = 1; d <= 31; d++) {
        const di = `${y}-${pad(m + 1)}-${pad(d)}`;
        const wd = d <= n ? mondayIndex(new Date(y, m, d)) : 0;
        cells.push(h('div', { class: 'lc' + (d > n ? ' na' : wd >= 5 ? ' we' : '') + (l === L - 1 ? ' last' : '') + (di === t ? ' td' : '') }));
      }

}

function yearMinis(root) {

  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
$('#backdrop').addEventListener('click', ev => { if (ev.target.id === 'backdrop') closeSheet(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#backdrop').classList.contains('open')) closeSheet(); });
(() => { // drag the sheet down to close
  const s = $('#sheet'); let y0 = null, dy = 0;
  s.addEventListener('touchstart', ev => { if (s.scrollTop <= 0) { y0 = ev.touches[0].clientY; dy = 0; s.classList.add('dragging'); } }, { passive: true });
  s.addEventListener('touchmove', ev => { if (y0 == null) return; dy = Math.max(0, ev.touches[0].clientY - y0); if (dy > 0) s.style.transform = `translateY(${dy}px)`; }, { passive: true });
  s.addEventListener('touchend', () => { if (y0 == null) return; s.classList.remove('dragging'); if (dy > 110) closeSheet(); else s.style.transform = ''; y0 = null; });
})();

// ============================================================
// Calendar files (.ics)
// ============================================================
function icsText(list) {
  const esc = s => String(s).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const out = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Motorsport Calendar//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Motorsport Calendar'];
  for (const e of list) {
    const c = CHAMPIONSHIPS[e.catCode];
    out.push('BEGIN:VEVENT', `UID:${e.id}@motorsport-calendar`, `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${e.startDate.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(e.endDate, 1).replace(/-/g, '')}`,
      `SUMMARY:${esc(e.label)}`, `DESCRIPTION:${esc(c.name + (e.status !== 'confirmed' ? ' (' + e.status + ')' : ''))}`,
      `CATEGORIES:${esc(c.name)}`, 'TRANSP:TRANSPARENT', 'END:VEVENT');
  }
  out.push('END:VCALENDAR');
  return out.join('\r\n');
}
function downloadICS(list, name) {
  const blob = new Blob([icsText(list)], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: `${name}.ics` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast(list.length === 1 ? 'Calendar file downloaded' : `${list.length} events downloaded`);
}
function exportVisible() {
  const list = filtered().filter(e => inYear(e, P.year));
  if (!list.length) { toast('No events to add. Turn on a series first.'); return; }
  downloadICS(list, `motorsport-calendar-${P.year}`);
}
function openAdd() { if (CONFIG.ADD_EVENT_URL) window.open(CONFIG.ADD_EVENT_URL, '_blank', 'noopener'); }

// ============================================================
// Toast
// ============================================================
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ============================================================
// Wiring
// ============================================================
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
  if (P.view === b.dataset.view) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  P.view = b.dataset.view; render(); window.scrollTo(0, 0);
}));
$('#year-select').addEventListener('change', ev => {
  P.year = +ev.target.value;
  const now = new Date();
  P.month = P.year === now.getFullYear() ? now.getMonth() : 0;
  render();
});
$('#export-btn').addEventListener('click', exportVisible);
$('#add-btn').addEventListener('click', openAdd);
window.addEventListener('scroll', () => $('#navbar').classList.toggle('scrolled', window.scrollY > 40), { passive: true });
wideMQ.addEventListener('change', render);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && CONFIG.DATA_URL && Date.now() - S.lastFetch > CONFIG.REFRESH_MINUTES * 60000) loadData();
});
setInterval(() => { if (document.visibilityState === 'visible' && CONFIG.DATA_URL) loadData(); }, Math.max(1, CONFIG.REFRESH_MINUTES) * 60000);
// Re-render just after midnight so "today" and countdowns stay right if the app is left open.
(function scheduleMidnight() { const n = new Date(); const ms = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1, 0, 0, 5) - n; setTimeout(() => { render(); scheduleMidnight(); }, ms); })();

// Start: show the last saved sheet (or built-in dates) straight away, then refresh.
const cached = CONFIG.DATA_URL ? storeGet(CACHE_KEY) : null;
const fromCache = cached && cached.text ? eventsFromCSV(cached.text) : null;
if (fromCache && fromCache.events.length) setEvents(fromCache.events, 'cached', cached.at, fromCache.skipped);
else setEvents(BUILT_IN, 'built-in', null, 0);
loadData();
</script>
